<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Keenwiix Store</title>
    <meta name="description" content="Get in touch with Keenwiix Store. We're here to help." />
    <link rel="canonical" href="https://keenwiix.github.io/keenwiix-store/contact.html" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="store.css" />
</head>
<body>

    <header class="site-header solid">
        <nav class="nav-container" aria-label="Main navigation">
            <a href="index.html" class="logo" aria-label="Homepage">
                <span class="keenwiix-logo">keenwiix</span>
                <span class="logo-suffix">Store</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html#featured">Shop</a></li>
                <li><a href="index.html#collection">Collection</a></li>
                <li><a href="index.html#story">Story</a></li>
                <li><a href="contact.html" aria-current="page">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a href="cart.html" class="nav-cart" aria-label="Shopping bag">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count">0</span>
                </a>
                <button class="hamburger" aria-label="Toggle menu" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
        </nav>
    </header>

    <nav class="mobile-menu" aria-label="Mobile navigation">
        <a href="index.html#featured">Shop</a>
        <a href="index.html#collection">Collection</a>
        <a href="index.html#story">Story</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Bag</a>
    </nav>

    <main>
        <section class="contact-page" aria-label="Contact">
            <div class="contact-card-wrap">
                <div class="contact-card">
                    <div class="contact-card-photo">
                        <img src="avatar.jpeg" alt="Keenwiix Store" />
                    </div>

                    <div class="contact-card-logo">
                        <span class="keenwiix-logo">keenwiix</span>
                        <span class="logo-suffix">Store</span>
                    </div>

                    <h2 class="contact-card-title">Questions? We're here.</h2>

                    <p class="contact-card-text">
                        About sizing, orders, returns, or anything else —<br />
                        reach out to us on Telegram.
                    </p>

                    <a href="https://t.me/keenwiix" target="_blank" rel="noopener" class="contact-card-btn">
                        <i class="fab fa-telegram-plane"></i>
                        <span>Message on Telegram</span>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer" role="contentinfo">
        <div class="footer-bottom">
            <p>&copy; 2026 Keenwiix Store. Concept project.</p>
        </div>
    </footer>

    <script src="store.js"></script>
</body>
</html>
